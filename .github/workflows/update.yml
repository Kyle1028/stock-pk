name: 更新財務資料

on:
  schedule:
    # 每天台灣時間 09:30（UTC 01:30）；月營收 10 日前、季報 3/31、5/15、8/14、11/14 前後會有新資料
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 抓取公開資訊觀測站資料
        run: node scripts/fetch_all.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新財務資料 $(date -u +%Y-%m-%d)"
            git push
          fi

name: 更新財務資料

# 每日自動更新改由本機電腦執行（scripts/update-local.cmd + Windows 工作排程器），
# 因為公開資訊觀測站對 GitHub 的國外主機回應很慢或會擋掉。
# 這裡只保留手動執行，需要時可到 Actions 頁面按 Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 抓取公開資訊觀測站資料
        run: node scripts/fetch_all.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新財務資料 $(date -u +%Y-%m-%d)"
            git push
          fi

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="上市櫃個股依產業篩選，比較月營收月增、年增與季報毛利率、EPS">
</head>
<body>
<title>個股財務PK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: control bar on top; screening table (left, scrolls) + sticky PK board (right); detail opens as a drawer. */
:root {
  --bg: #f4f3ee;          /* warm paper, biased toward the gold band */
  --surface: #ffffff;
  --surface-2: #faf9f5;
  --ink: #1c1e24;
  --ink-2: #5a5e68;
  --ink-3: #8a8d95;
  --line: #e2e0d8;
  --line-2: #cfccc2;
  --accent: #2c4a7a;      /* interactive: links, active segment, selected row */
  --accent-soft: #e4ebf6;
  --gold: #f2d27a;        /* group band, from the original sheet */
  --gold-ink: #3d3005;
  --up: #c4362b;          /* 台股慣例：紅漲 */
  --down: #1e8449;        /* 綠跌 */
  --up-soft: #fbe9e7;
  --down-soft: #e5f4ea;
  --series-1: #2a78d6;
  --series-2: #b9b6ac;
  --grid: #e1e0d9;
  --shadow: 0 10px 30px rgba(28,30,36,.14);
  --shadow-sm: 0 1px 2px rgba(28,30,36,.06), 0 2px 8px rgba(28,30,36,.04);
  --font-ui: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-tc: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --surface: #1e2026; --surface-2: #23262d; --ink: #ecebe6; --ink-2: #b4b3ab; --ink-3: #7d7f88;
    --line: #2e3139; --line-2: #3c404a; --accent: #8fb0e6; --accent-soft: #263349; --gold: #a7822a; --gold-ink: #fff7df;
    --up: #ef6b5e; --down: #4fbf7c; --up-soft: #3a2220; --down-soft: #1b3326; --series-1: #3987e5; --series-2: #5a5d66; --grid: #2c2c2a;
    --shadow: 0 10px 30px rgba(0,0,0,.5); --shadow-sm: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1e2026; --surface-2: #23262d; --ink: #ecebe6; --ink-2: #b4b3ab; --ink-3: #7d7f88;
  --line: #2e3139; --line-2: #3c404a; --accent: #8fb0e6; --accent-soft: #263349; --gold: #a7822a; --gold-ink: #fff7df;
  --up: #ef6b5e; --down: #4fbf7c; --up-soft: #3a2220; --down-soft: #1b3326; --series-1: #3987e5; --series-2: #5a5d66; --grid: #2c2c2a;
  --shadow: 0 10px 30px rgba(0,0,0,.5); --shadow-sm: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1680px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
h1, h2, h3 { font-family: var(--font-tc); margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); } .na { color: var(--ink-3); }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
.head h1 { font-size: 26px; font-weight: 700; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; flex: none; }
.head .sub { font-size: 13.5px; }
.head .sub { color: var(--ink-2); margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; box-shadow: var(--shadow-sm); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
.filters { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.filters .lbl { margin-right: 4px; font-size: 12px; color: var(--ink-2); }
.more-btn { border: 1px dashed var(--line-2); background: none; border-radius: 999px; padding: 4px 12px; color: var(--ink-2); font-size: 13px; min-height: 34px; }
.more-btn:hover { border-color: var(--accent); color: var(--accent); }
.more-btn .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.extra { display: contents; }
.extra[hidden] { display: none; }
.reset { border: 0; background: none; color: var(--ink-3); font-size: 12px; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
.reset:hover { color: var(--accent); }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl label, .ctl .lbl { font-size: 12px; color: var(--ink-2); letter-spacing: .04em; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { background: var(--surface); border: 0; padding: 6px 12px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
select, input[type="search"], input[type="number"] { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; min-height: 34px; }
input[type="number"] { width: 72px; text-align: right; }
input[type="search"] { width: 170px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px; background: var(--surface); color: var(--ink-2); user-select: none; transition: background .15s, border-color .15s; }
.toggle input { margin: 0; accent-color: var(--accent); }
.toggle[data-on="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.toggle input[type="number"] { min-height: 28px; padding: 2px 6px; background: var(--surface); }
.toggle .unit { color: var(--ink-2); }
.spacer { flex: 1; }
.count { color: var(--ink-2); white-space: nowrap; }
.count b { color: var(--ink); font-weight: 600; font-size: 16px; }

/* two columns */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 620px); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .pk { position: static !important; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; box-shadow: var(--shadow-sm); overflow: hidden; }
.panel-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 16px; font-weight: 700; }
.panel-h .hint { color: var(--ink-2); font-size: 12px; }
.tbl-wrap { overflow-x: auto; max-height: calc(100vh - 230px); overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { position: sticky; top: 0; background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 12px; text-align: right; z-index: 2; cursor: pointer; user-select: none; border-bottom: 2px solid var(--line-2); }
thead th:hover { color: var(--ink); }
tbody tr { background: var(--surface); }
/* 代號、名稱欄固定在左側，橫向捲動時仍看得到是哪一檔 */
#listWrap .c1, #listWrap .c2 { position: sticky; background: inherit; z-index: 1; }
#listWrap .c1 { left: 0; min-width: 62px; }
#listWrap .c2 { left: 62px; box-shadow: 1px 0 0 var(--line); }
#listWrap thead .c1, #listWrap thead .c2 { z-index: 3; background: var(--surface-2); }
thead th.l { text-align: left; }
thead th[aria-sort] { color: var(--accent); }
thead th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
thead th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--accent-soft); }
tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.l { text-align: left; }
.code { color: var(--ink-2); font-size: 12px; }
.name { font-family: var(--font-tc); font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; }
.name:hover { text-decoration: underline; text-underline-offset: 3px; }
.add { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--ink-2); min-height: 26px; transition: background .15s; }
.add:hover { border-color: var(--accent); color: var(--accent); }
.add[aria-pressed="true"]:hover { color: #fff; opacity: .9; }
.add[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.px { font-weight: 600; font-size: 14px; }
.pill { display: inline-block; min-width: 64px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.pill.up { background: var(--up-soft); }
.pill.down { background: var(--down-soft); }
.empty { padding: 28px 16px; color: var(--ink-2); text-align: center; }

/* PK board */
.pk { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.pk .tbl-wrap { max-height: none; }
.pk table { font-size: 12.5px; }
.pk th, .pk td { padding: 6px 8px; }
.pk tbody tr:nth-child(even):not(.band) { background: var(--surface-2); }
.pk thead th { position: static; cursor: default; text-align: right; }
.pk thead th.l { text-align: left; }
.pk thead th .pkname { display: block; font-family: var(--font-tc); font-weight: 700; color: var(--ink); font-size: 13px; }
.pk thead th .pkcode { color: var(--ink-2); font-size: 11px; }
.pk thead th .rm { border: 0; background: none; color: var(--ink-3); padding: 0 2px; font-size: 13px; line-height: 1; }
.pk thead th .rm:hover { color: var(--up); }
.pk td.lbl { text-align: left; color: var(--ink-2); font-family: var(--font-tc); }
.pk tr.band td { background: var(--gold); color: var(--gold-ink); font-family: var(--font-tc); font-weight: 700; font-size: 12px; letter-spacing: .1em; padding: 4px 10px; }
.pk td.best { font-weight: 600; }
.pk td.best::after { content: " ●"; color: var(--gold); font-size: 8px; vertical-align: middle; }
.pk .foot { padding: 8px 14px; color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--line); }
.pk .clear { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 0; }

/* detail drawer */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.drawer-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 18px; flex: 1; min-width: 0; }
.drawer-h .meta { color: var(--ink-2); font-size: 12px; }
.drawer-h .x { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.drawer-b { overflow: auto; padding: 14px 18px 32px; display: grid; gap: 22px; }
.sec h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: baseline; gap: 10px; }
.sec h3 small { color: var(--ink-2); font-weight: 400; font-size: 12px; }
.sec table { font-size: 13px; }
.sec thead th { position: static; cursor: default; }
.chart { width: 100%; height: auto; display: block; margin-bottom: 8px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; z-index: 30; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
.note { color: var(--ink-3); font-size: 12px; margin-top: 18px; line-height: 1.6; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: 0; } } }
@media (max-width: 640px) { .toggle { padding: 2px 8px; font-size: 13px; gap: 4px; } .toggle input[type="number"] { width: 60px; } .head h1 { font-size: 22px; } th, td { padding: 6px 7px; } input[type="search"] { width: 130px; } }
</style>

<div class="wrap">
  <header class="head">
    <div>
      <h1><span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="10" width="4" height="8" rx="1"/><rect x="8" y="4" width="4" height="14" rx="1"/><rect x="14" y="7" width="4" height="11" rx="1"/></svg></span>個股財務PK</h1>
      <div class="sub">依產業篩選上市櫃個股，比較月營收月增、年增與季報獲利能力</div>
    </div>
    <div class="chips" id="chips"><span class="chip">載入資料中…</span></div>
  </header>

  <section class="controls" aria-label="篩選條件">
    <div class="ctl"><span class="lbl">市場別</span>
      <div class="seg" id="market" role="group" aria-label="市場別">
        <button type="button" data-v="上市" aria-pressed="true">上市</button>
        <button type="button" data-v="上櫃" aria-pressed="false">上櫃</button>
        <button type="button" data-v="全部" aria-pressed="false">全部</button>
      </div>
    </div>
    <div class="ctl"><label for="industry">產業別</label><select id="industry"></select></div>
    <div class="ctl"><label for="q">搜尋</label><input type="search" id="q" placeholder="代號或名稱"></div>
    <div class="spacer"></div>
    <div class="count" id="count"></div>
    <div class="filters" id="filters" role="group" aria-label="數值篩選"></div>
  </section>

  <div class="cols">
    <section class="panel" aria-label="篩選結果">
      <div class="panel-h"><h2 id="listTitle">篩選結果</h2><span class="hint">點欄位標題排序；點「PK」加入右側比較（最多 6 檔）；點名稱看月營收與近八季 EPS</span></div>
      <div class="tbl-wrap" id="listWrap"><div class="empty">載入資料中…</div></div>
    </section>

    <aside class="panel pk" aria-label="個股財務PK">
      <div class="panel-h"><h2 id="pkTitle">個股財務PK</h2><span class="hint" id="pkHint"></span></div>
      <div class="tbl-wrap" id="pkWrap"></div>
      <div class="foot" id="pkFoot"></div>
    </aside>
  </div>

  <p class="note" id="note"></p>
</div>

<div id="drawerRoot"></div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const LS = { get(k, d) { try { const v = localStorage.getItem('pk:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('pk:' + k, JSON.stringify(v)); } catch {} } };
  const fmtN = (v, d = 0) => v == null || !isFinite(v) ? '—' : v.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
  const fmtP = v => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(2) + '%';
  const cls = v => v == null || !isFinite(v) ? 'na' : v > 0 ? 'up' : v < 0 ? 'down' : '';
  const pct = (a, b) => (a == null || b == null || b === 0) ? null : (a - b) / Math.abs(b);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 即時股價中繼（Cloudflare Worker，見 worker/）。留空則不顯示股價欄位。
  const PRICE_API = 'https://stock-pk-price.kyle10281202.workers.dev/';
  const quotes = {};       // code -> { p, y, t, live }
  let D = null;            // snapshot
  let rows = [];           // computed metrics per stock
  // 數值篩選條件：on = 是否啟用、val = 門檻（顯示單位）；scale 為顯示值換算成資料值的除數；abs 取絕對值、max 為「以下」
  const FILTERS = [
    { flag: 'fVol', inp: 'volMin', key: 'vol', label: '日均量 ≥', unit: '張', on: true, val: 1000, scale: 1, step: 100, min: 0 },
    { flag: 'fGm', inp: 'gmMin', key: 'gm', label: '毛利率 ≥', unit: '%', on: true, val: 15, scale: 100, step: 1, min: -100 },
    { flag: 'fMom', inp: 'momMin', key: 'mom', label: '月增率 ≥', unit: '%', on: false, val: 0, scale: 100, step: 1, min: -100 },
    { flag: 'fYoy', inp: 'yoyMin', key: 'yoy', label: '年增率 ≥', unit: '%', on: false, val: 0, scale: 100, step: 1, min: -100 },
    { flag: 'fOm', inp: 'omMin', key: 'om', label: '營益率 ≥', unit: '%', on: false, val: 5, scale: 100, step: 1, min: -100 },
    { flag: 'fNm', inp: 'nmMin', key: 'nm', label: '淨利率 ≥', unit: '%', on: false, val: 5, scale: 100, step: 1, min: -100 },
    { flag: 'fNonop', inp: 'nonopMax', key: 'nonop', label: '業外收支/營收 ±≤', unit: '%', on: false, val: 20, scale: 100, step: 1, min: 0, abs: true, max: true },
    { flag: 'fEps', inp: 'epsMin', key: 'eps', label: 'EPS ≥', unit: '元', on: false, val: 0, scale: 1, step: 0.5, min: -100 },
    { flag: 'fEpsYoy', inp: 'epsYoyMin', key: 'epsYoy', label: 'EPS年增 ≥', unit: '%', on: false, val: 0, scale: 100, step: 1, min: -100 },
  ];
  let state = { market: LS.get('market', '上市'), industry: LS.get('industry', '電腦及週邊設備業'), q: '', sort: LS.get('sort', { k: 'rev', dir: 'desc' }), more: LS.get('more', false) };
  for (const f of FILTERS) { state[f.flag] = LS.get(f.flag, f.on); state[f.inp] = LS.get(f.inp, f.val); }
  let pk = LS.get('pk', ['2362', '2353', '2376', '2377', '2382', '2324']);

  // ---- metrics ----
  function singleQ(s, i) {           // de-cumulate quarter i of s.q → [rev,gp,op,nonop,ni,nip,eps] or null
    const cur = s.q[i]; if (!cur) return null;
    const season = +D.quarters[i].slice(-1);
    if (season === 1) return cur.slice();
    const prev = s.q[i - 1]; if (!prev) return null;
    return cur.map((v, k) => (v == null || prev[k] == null) ? null : v - prev[k]);
  }
  function compute() {
    const L = D.months.length - 1, Q = D.quarters.length - 1;
    const curYear = D.months[L].slice(0, 3);
    rows = Object.entries(D.stocks).map(([code, s]) => {
      const rev = s.rev[L], prev = s.rev[L - 1], ly = s.ly[L];
      let cum = 0, cumLy = 0, has = false;
      D.months.forEach((m, i) => { if (m.slice(0, 3) === curYear && s.rev[i] != null && s.ly[i] != null) { cum += s.rev[i]; cumLy += s.ly[i]; has = true; } });
      const q = singleQ(s, Q), qly = singleQ(s, Q - 4);
      const r = q && q[0] ? q[0] : null;
      const safe = (n) => (q && r && q[n] != null) ? q[n] / r : null;
      const eps = q ? q[6] : null, epsLy = qly ? qly[6] : null;
      return { code, name: s.n, market: s.m, ind: s.i, rev, vol: s.v ?? null, mom: pct(rev, prev), yoy: pct(rev, ly), cumYoy: has ? pct(cum, cumLy) : null,
        gm: safe(1), om: safe(2), nm: (q && r && (q[5] ?? q[4]) != null) ? (q[5] ?? q[4]) / r : null, nonop: safe(3), eps, epsYoy: pct(eps, epsLy), s };
    });
  }

  // ---- filtering / list ----
  function filtered() {
    const q = state.q.trim().toLowerCase();
    return rows.filter(r => (state.market === '全部' || r.market === state.market)
      && (q ? (r.code.includes(q) || r.name.toLowerCase().includes(q)) : (state.industry === '全部產業' || r.ind === state.industry))
      && FILTERS.every(f => {
        if (!state[f.flag]) return true;

  // ---- detail drawer ----
  function barChart(cats, a, b, labelA, labelB, fmt) {
    // grouped bars: a = current, b = year-ago; one shared scale
    const W = 720, H = 220, padL = 56, padR = 12, padT = 14, padB = 34;
    const all = [...a, ...b].filter(v => v != null);
    let max = Math.max(0, ...all), min = Math.min(0, ...all);
    if (max === min) max = min + 1;
    const span = max - min, y = v => padT + (max - v) / span * (H - padT - padB);
    const n = cats.length, gw = (W - padL - padR) / n, bw = Math.min(22, (gw - 8) / 2);
    const ticks = 4, step = span / ticks;
    let g = '';
    for (let i = 0; i <= ticks; i++) { const v = min + step * i, yy = y(v); g += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${padL - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`; }
    let bars = '';
    cats.forEach((c, i) => {
      const x0 = padL + gw * i + (gw - bw * 2 - 2) / 2;
      const draw = (v, x, fill, lab) => { if (v == null) return ''; const y1 = y(Math.max(0, v)), y2 = y(Math.min(0, v)); const h = Math.max(1, y2 - y1); return `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="2" fill="${fill}" data-tip="${esc(c)} ${lab}：${fmt(v)}"/>`; };
      bars += draw(b[i], x0, 'var(--series-2)', labelB) + draw(a[i], x0 + bw + 2, 'var(--series-1)', labelA);
      bars += `<text x="${padL + gw * i + gw / 2}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${esc(c)}</text>`;
    });
    const zero = `<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-width="1"/>`;
    return `<div class="legend"><span><i style="background:var(--series-1)"></i>${labelA}</span><span><i style="background:var(--series-2)"></i>${labelB}</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${labelA}與${labelB}長條圖">${g}${bars}${zero}</svg>`;
  }
  function openDetail(code) {

    const L = D.months.length - 1, Q = D.quarters.length - 1, n = rows.length;
    $('#chips').innerHTML = `<span class="chip">月營收 <b>${D.months[L]}</b></span><span class="chip">季報 <b>${D.quarters[Q]}</b></span>${D.asof.vol ? `<span class="chip">日均量 <b>近${D.asof.vol.days}日</b></span>` : ''}<span class="chip">涵蓋 <b>${n.toLocaleString()}</b> 檔上市櫃</span><span class="chip">資料擷取 <b>${D.asof.fetched}</b></span>`;
    $('#note').innerHTML = `資料來源：公開資訊觀測站（月營收彙總表、綜合損益表彙總）、臺灣證券交易所與櫃買中心 OpenAPI。日均成交量為近 20 個交易日成交股數的平均（以張計，1 張 = 1,000 股），取自證交所與櫃買中心每日收盤行情。月營收單位為新台幣，表內換算為百萬元；季報比率以 ${D.quarters[Q]} 單季計算（由累計數拆算），EPS 年增率以去年同季單季 EPS 為基準。金融保險等非一般業損益表格式者不計算毛利率。紅色為正、綠色為負，依台股慣例。`;
    buildFilters(); applyStateToControls(); fillIndustries(); renderList(); renderPK(); startPrices();
  }).catch(() => { $('#listWrap').innerHTML = '<div class="empty">資料載入失敗，請重新整理頁面。</div>'; $('#chips').innerHTML = ''; });
})();
</script>

</body>
</html>
